<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Configurações básicas da página -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>

  <!-- Importa o arquivo de estilos -->
  <link rel="stylesheet" href="style.css">

  <!-- Aplica o tema salvo antes da página desenhar, evitando um "flash" da cor errada -->
  <script>
    (function () {
      const saved = localStorage.getItem('todo-app-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <main class="app">
    <div class="app-header">
      <h1>Minha Lista de Tarefas</h1>

      <!-- Botão para alternar entre modo claro e escuro -->
      <button type="button" id="theme-toggle" aria-label="Alternar modo escuro">🌙</button>
    </div>

    <!-- Formulário para adicionar novas tarefas -->
    <form id="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Digite uma nova tarefa..."
        autocomplete="off"
      >
      <button type="submit">Adicionar</button>
    </form>

    <!-- Filtro para exibir todas as tarefas, só pendentes ou só concluídas -->
    <div id="filters" class="filters">
      <button type="button" class="filter-btn active" data-filter="all">Todas</button>
      <button type="button" class="filter-btn" data-filter="pending">Pendentes</button>
      <button type="button" class="filter-btn" data-filter="completed">Concluídas</button>
    </div>

    <!-- Lista onde as tarefas serão exibidas dinamicamente pelo JavaScript -->
    <ul id="task-list"></ul>

    <!-- Mensagem exibida quando não há tarefas -->
    <p id="empty-message">Nenhuma tarefa por aqui. Adicione a primeira! 🎉</p>

    <!-- Contador de tarefas restantes (atualizado pelo JavaScript) -->
    <p id="tasks-counter"></p>
  </main>

  <!-- Importa o arquivo de lógica (deve vir depois do HTML para garantir que os elementos já existam) -->
  <script src="script.js"></script>
</body>
</html>
